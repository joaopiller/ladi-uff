{% if inscricao and inscricao.disponivel %}
<a href="{{ inscricao.link }}" target="_blank" rel="noopener" class="btn btn-principal w-100">
  Fazer inscrição <i class="bi bi-box-arrow-up-right ms-1"></i>
</a>
{% else %}
<button type="button" class="btn btn-principal w-100" disabled>
  <i class="bi bi-clock me-1"></i> Inscrições em breve
</button>
{% endif %}
