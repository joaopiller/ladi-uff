<section class="cabecalho-admin">
  <div class="container">
    <div>
      <p class="banner-pre">Painel administrativo</p>
      <h1>{{ titulo_pagina }}{% if destaque %} <span>{{ destaque }}</span>{% endif %}</h1>
    </div>
    <form method="POST" action="{{ url_for('sair') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-banner btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
    </form>
  </div>
</section>

<nav class="menu-admin">
  <div class="container">
    <a href="{{ url_for('painel') }}" class="{% if request.endpoint == 'painel' %}ativo{% endif %}"><i class="bi bi-grid me-1"></i>Início</a>
    <a href="{{ url_for('admin_membros') }}" class="{% if 'membro' in request.endpoint %}ativo{% endif %}"><i class="bi bi-people me-1"></i>Membros</a>
    <a href="{{ url_for('admin_artigos') }}" class="{% if 'artigo' in request.endpoint %}ativo{% endif %}"><i class="bi bi-journal-text me-1"></i>Artigos</a>
    <a href="{{ url_for('admin_tags') }}" class="{% if 'tag' in request.endpoint %}ativo{% endif %}"><i class="bi bi-tags me-1"></i>Tags</a>
    <a href="{{ url_for('admin_eventos') }}" class="{% if 'evento' in request.endpoint %}ativo{% endif %}"><i class="bi bi-calendar-event me-1"></i>Eventos</a>
    <a href="{{ url_for('admin_inscricoes') }}" class="{% if 'inscric' in request.endpoint %}ativo{% endif %}"><i class="bi bi-clipboard-check me-1"></i>Inscrições</a>
  </div>
</nav>
