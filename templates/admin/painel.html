{% extends "base.html" %}

{% block titulo %}Painel | LADI-UFF{% endblock %}

{% block conteudo %}
  <section class="cabecalho-admin">
    <div class="container">
      <p class="banner-pre">Painel administrativo</p>
      <h1>Olá, <span>{{ admin.usuario }}</span></h1>
      <form method="POST" action="{{ url_for('sair') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-banner btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </form>
    </div>
  </section>

  <section class="secao secao-admin">
    <div class="container">
      {% include "partials/_mensagens.html" %}
      <p class="texto">Use o menu do painel para gerenciar o conteúdo do site.</p>
    </div>
  </section>
{% endblock %}
