<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#274359">
  <title>{% block titulo %}LADI-UFF | Liga Acadêmica de Direito Internacional{% endblock %}</title>
  <meta name="description" content="{% block descricao %}Liga Acadêmica de Direito Internacional da Universidade Federal Fluminense.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:title" content="{{ self.titulo() }}">
  <meta property="og:description" content="{{ self.descricao() }}">
  <meta property="og:image" content="{{ url_for('static', filename='img/preview-ladi.png', _external=True) }}">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="256">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-ladi.png') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  {% block estilos %}{% endblock %}
</head>
<body>

  {% include "partials/_navbar.html" %}

  <main>
{% block conteudo %}{% endblock %}
  </main>

  {% include "partials/_rodape.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/global.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
